<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動物數字填色遊戲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;background:linear-gradient(135deg,#6c5ce7,#a29bfe);min-height:100vh;padding:16px}
.screen{display:none}.screen.active{display:block}

/* START */
#start-screen{max-width:560px;margin:0 auto;text-align:center;padding:60px 20px;color:#fff}
#start-screen h1{font-size:2.6em;margin-bottom:10px;text-shadow:2px 4px 8px rgba(0,0,0,.3)}
#start-screen p{font-size:1.1em;margin-bottom:40px;opacity:.9}
.emoji-row{font-size:3em;margin-bottom:30px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* LEVEL SELECT */
#level-select{max-width:680px;margin:0 auto;color:#fff}
#level-select h2{text-align:center;font-size:1.9em;margin-bottom:20px;text-shadow:1px 2px 4px rgba(0,0,0,.3)}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.lv-card{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:all .2s;color:#fff}
.lv-card:hover{background:rgba(255,255,255,.35);transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.lv-card.done{background:rgba(253,203,110,.3);border-color:rgba(253,203,110,.7)}
.lv-emoji{font-size:1.9em;margin-bottom:3px}.lv-num{font-size:.75em;opacity:.8}.lv-name{font-size:.88em;font-weight:700}.lv-star{color:#fdcb6e}

/* GAME */
#game-screen{max-width:880px;margin:0 auto}
.g-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:#fff;flex-wrap:wrap}
.g-title{flex:1;font-size:1.35em;font-weight:700;text-shadow:1px 1px 4px rgba(0,0,0,.3)}
.prog-wrap{width:130px}.prog-label{font-size:.72em;opacity:.8;margin-bottom:3px}
.prog-bar{background:rgba(255,255,255,.3);border-radius:8px;height:11px;overflow:hidden}
.prog-fill{background:#fdcb6e;height:100%;border-radius:8px;transition:width .4s}
.g-body{display:flex;gap:16px;align-items:flex-start}
.svg-wrap{flex:1;background:#fff;border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:0}
.svg-wrap svg{width:100%;height:auto;display:block}
.svg-wrap svg .region{cursor:pointer;transition:filter .15s}
.svg-wrap svg .region:hover{filter:brightness(.88)}
.c-panel{width:160px;flex-shrink:0;background:rgba(255,255,255,.18);border-radius:16px;padding:12px 10px;border:1.5px solid rgba(255,255,255,.3)}
.cp-title{color:#fff;text-align:center;font-size:.88em;margin-bottom:8px;font-weight:700}
.c-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.c-btn{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.5);cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.c-btn:hover{transform:scale(1.18);border-color:#fff}
.c-btn.sel{border-color:#fff;border-width:4px;transform:scale(1.2);box-shadow:0 0 0 3px rgba(255,255,255,.5),0 4px 12px rgba(0,0,0,.3)}
.cp-hint{color:rgba(255,255,255,.7);font-size:.72em;text-align:center;margin-top:8px;line-height:1.4}

/* COMPLETE */
#complete-screen{max-width:460px;margin:0 auto;text-align:center;color:#fff;padding:40px 20px}
.c-stars{font-size:3.2em;margin-bottom:12px;animation:pop .5s ease}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#complete-screen h2{font-size:2em;margin-bottom:8px;text-shadow:2px 2px 6px rgba(0,0,0,.3)}
#complete-screen p{font-size:1em;margin-bottom:18px;opacity:.9}
.c-svg-wrap{max-width:260px;margin:0 auto 22px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.c-svg-wrap svg{width:100%;height:auto;display:block}

/* BUTTONS */
.btn{display:inline-block;border:none;border-radius:50px;padding:11px 28px;font-size:1em;font-family:inherit;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(0,0,0,.2);margin:4px}
.btn:hover{transform:translateY(-3px);box-shadow:0 7px 18px rgba(0,0,0,.3)}
.btn-w{background:#fff;color:#6c5ce7}.btn-y{background:#fdcb6e;color:#2d3436}
.btn-sm{padding:8px 18px;font-size:.88em}

/* TOAST */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(45,52,54,.92);color:#fff;padding:10px 22px;border-radius:28px;font-size:.95em;transition:transform .3s;z-index:1000;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:600px){
  .level-grid{grid-template-columns:repeat(3,1fr)}
  .g-body{flex-direction:column}
  .c-panel{width:100%}.c-grid{grid-template-columns:repeat(6,1fr)}
  #start-screen h1{font-size:2em}
}
</style>
</head>
<body>

<div id="start-screen" class="screen active">
  <div class="emoji-row">🦋🐱🐟🐸🐰🐝🦉🐧🦁🐢</div>
  <h1>動物填色遊戲</h1>
  <p>選顏色，點區塊，讓動物亮起來！</p>
  <button class="btn btn-w" onclick="showLevelSelect()">▶ 開始遊戲</button>
</div>

<div id="level-select" class="screen">
  <h2>🗺 選擇關卡</h2>
  <div class="level-grid" id="levelGrid"></div>
  <div style="text-align:center"><button class="btn btn-w btn-sm" onclick="showScreen('start-screen')">← 返回</button></div>
</div>

<div id="game-screen" class="screen">
  <div class="g-header">
    <button class="btn btn-w btn-sm" onclick="showLevelSelect()">← 返回</button>
    <div class="g-title" id="gTitle">第 1 關</div>
    <div class="prog-wrap">
      <div class="prog-label">著色進度</div>
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="g-body">
    <div class="svg-wrap" id="svgWrap"></div>
    <div class="c-panel">
      <div class="cp-title">🎨 選顏色</div>
      <div class="c-grid" id="cGrid"></div>
      <div class="cp-hint">先選顏色<br>再點圖案數字區塊</div>
      <div style="text-align:center;margin-top:10px">
        <button class="btn btn-w btn-sm" onclick="resetLevel()">↺ 重置</button>
      </div>
    </div>
  </div>
</div>

<div id="complete-screen" class="screen">
  <div class="c-stars">⭐⭐⭐</div>
  <h2 id="cTitle">完成了！</h2>
  <p id="cSub">太棒了！</p>
  <div class="c-svg-wrap" id="cSvg"></div>
  <button class="btn btn-w" onclick="showLevelSelect()">選關卡</button>
  <button class="btn btn-y" id="nextBtn" onclick="nextLevel()">下一關 →</button>
</div>

<div id="toast"></div>

];// ── State ──
let cur=0, selCol=PAL[0], colored={};
let done=new Set(JSON.parse(localStorage.getItem('din_done')||'[]'));

// ── Screens ──
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function showLevelSelect(){renderGrid();showScreen('level-select')}

// ── Level grid ──
function renderGrid(){
  document.getElementById('levelGrid').innerHTML=LEVELS.map((lv,i)=>`
    <div class="lv-card ${done.has(i)?'done':''}" onclick="startLevel(${i})">
      <div class="lv-emoji">${lv.emoji}</div>
      <div class="lv-num">第 ${i+1} 關</div>
      <div class="lv-name">${lv.name}</div>
      ${done.has(i)?'<div class="lv-star">⭐</div>':''}
    </div>`).join('')
}

// ── Palette ──
function renderPal(){
  document.getElementById('cGrid').innerHTML=PAL.map((c,i)=>`
    <button class="c-btn ${c===selCol?'sel':''}" style="background:${c}" title="${PNAME[i]}"
      onclick="pickCol('${c}',this)"></button>`).join('')
}
function pickCol(c,btn){
  selCol=c;
  document.querySelectorAll('.c-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

// ── Load level ──
function startLevel(i){
  cur=i; colored={};
  document.getElementById('gTitle').textContent=`第 ${i+1} 關 · ${LEVELS[i].emoji} ${LEVELS[i].name}`;
  document.getElementById('svgWrap').innerHTML=LEVELS[i].svg;
  document.getElementById('progFill').style.width='0%';
  renderPal();
  document.querySelectorAll('#svgWrap .region').forEach(el=>{
    el.addEventListener('click',()=>{const g=el.dataset.group;if(g)applyCol(+g)});
  });
  showScreen('game-screen');
}

function applyCol(g){
  colored[g]=selCol;
  document.querySelectorAll(`#svgWrap .region[data-group="${g}"]`).forEach(el=>el.setAttribute('fill',selCol));
  updateProg();
  checkWin();
}

function updateProg(){
  const all=new Set([...document.querySelectorAll('#svgWrap .region[data-group]')].map(e=>e.dataset.group));
  document.getElementById('progFill').style.width=(all.size?Object.keys(colored).length/all.size*100:0)+'%';
}

function checkWin(){
  const all=new Set([...document.querySelectorAll('#svgWrap .region[data-group]')].map(e=>e.dataset.group));
  if(Object.keys(colored).length>=all.size) setTimeout(showComplete,600);
}

function resetLevel(){startLevel(cur)}

// ── Complete ──
function showComplete(){
  done.add(cur);
  localStorage.setItem('din_done',JSON.stringify([...done]));
  const lv=LEVELS[cur];
  document.getElementById('cTitle').textContent=`完成了！${lv.emoji}`;
  document.getElementById('cSub').textContent=`第 ${cur+1} 關「${lv.name}」著色完成，真棒！`;
  document.getElementById('cSvg').innerHTML=document.getElementById('svgWrap').innerHTML;
  document.getElementById('nextBtn').style.display=cur<LEVELS.length-1?'':'none';
  showScreen('complete-screen');
}
function nextLevel(){startLevel(cur+1)}

// ── Toast ──
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ── Init ──
renderGrid();renderPal();
</script>
