<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動物數字填色遊戲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;background:linear-gradient(135deg,#6c5ce7,#a29bfe);min-height:100vh;padding:12px}
.screen{display:none}.screen.active{display:block}

/* START */
#start-screen{max-width:520px;margin:0 auto;text-align:center;padding:60px 20px;color:#fff}
#start-screen h1{font-size:2.4em;margin-bottom:10px;text-shadow:2px 4px 8px rgba(0,0,0,.3)}
#start-screen p{font-size:1.05em;margin-bottom:36px;opacity:.9}
.emoji-row{font-size:3em;margin-bottom:28px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* LEVEL SELECT */
#level-select{max-width:660px;margin:0 auto;color:#fff}
#level-select h2{text-align:center;font-size:1.8em;margin-bottom:18px;text-shadow:1px 2px 4px rgba(0,0,0,.3)}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.lv-card{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:all .2s;color:#fff}
.lv-card:hover{background:rgba(255,255,255,.35);transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.lv-card.done{background:rgba(253,203,110,.3);border-color:rgba(253,203,110,.7)}
.lv-emoji{font-size:1.9em;margin-bottom:3px}.lv-num{font-size:.73em;opacity:.8}.lv-name{font-size:.88em;font-weight:700}.lv-star{color:#fdcb6e}

/* GAME */
#game-screen{max-width:900px;margin:0 auto}
.g-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:#fff;flex-wrap:wrap}
.g-title{flex:1;font-size:1.25em;font-weight:700;text-shadow:1px 1px 4px rgba(0,0,0,.3)}
.prog-wrap{width:120px}
.prog-label{font-size:.7em;opacity:.8;margin-bottom:3px}
.prog-bar{background:rgba(255,255,255,.3);border-radius:8px;height:11px;overflow:hidden}
.prog-fill{background:#fdcb6e;height:100%;border-radius:8px;transition:width .4s}

.g-body{display:flex;gap:14px;align-items:flex-start}

/* Color Legend Panel */
.legend-panel{width:150px;flex-shrink:0;background:rgba(255,255,255,.18);border-radius:16px;padding:10px 8px;border:1.5px solid rgba(255,255,255,.3)}
.lp-title{color:#fff;text-align:center;font-size:.82em;margin-bottom:8px;font-weight:700;opacity:.9}
.swatch-list{display:flex;flex-direction:column;gap:7px}
.swatch{display:flex;align-items:center;border-radius:10px;overflow:hidden;cursor:pointer;border:3px solid rgba(255,255,255,.5);transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.25);height:38px}
.swatch:hover{border-color:#fff;transform:scale(1.04)}
.swatch.sel{border-color:#fff;border-width:4px;transform:scale(1.06);box-shadow:0 0 0 3px rgba(255,255,255,.6),0 4px 12px rgba(0,0,0,.3)}
.swatch-num{background:rgba(0,0,0,.45);color:#fff;font-weight:900;font-size:1.05em;width:34px;min-width:34px;height:100%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.swatch-color{flex:1;height:100%;min-width:0}

/* SVG */
.svg-wrap{flex:1;background:#fff;border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:0}
.svg-wrap svg{width:100%;height:auto;display:block}
.svg-wrap svg .region{cursor:pointer;transition:filter .12s}
.svg-wrap svg .region:hover{filter:brightness(.88)}
.svg-wrap svg .region.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,0)}75%{transform:translate(4px,0)}}
.svg-wrap svg .region.correct{animation:flash .35s}
@keyframes flash{0%,100%{filter:none}50%{filter:brightness(1.5)}}

/* Actions */
.g-actions{margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

/* COMPLETE */
#complete-screen{max-width:440px;margin:0 auto;text-align:center;color:#fff;padding:36px 20px}
.c-stars{font-size:3em;margin-bottom:10px;animation:pop .5s ease}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#complete-screen h2{font-size:2em;margin-bottom:8px;text-shadow:2px 2px 6px rgba(0,0,0,.3)}
#complete-screen p{font-size:.98em;margin-bottom:16px;opacity:.9}
.c-svg-wrap{max-width:250px;margin:0 auto 20px;background:#fff;border-radius:16px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.c-svg-wrap svg{width:100%;height:auto;display:block}

/* TOAST */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(45,52,54,.92);color:#fff;padding:10px 20px;border-radius:28px;font-size:.92em;transition:transform .3s;z-index:1000;pointer-events:none;text-align:center;max-width:280px}
#toast.show{transform:translateX(-50%) translateY(0)}

/* BUTTONS */
.btn{display:inline-block;border:none;border-radius:50px;padding:10px 26px;font-size:.97em;font-family:inherit;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(0,0,0,.2);margin:3px}
.btn:hover{transform:translateY(-3px);box-shadow:0 7px 18px rgba(0,0,0,.3)}
.btn-w{background:#fff;color:#6c5ce7}.btn-y{background:#fdcb6e;color:#2d3436}
.btn-sm{padding:8px 18px;font-size:.86em}

/* Instruction banner */
.tip-bar{background:rgba(255,255,255,.15);border-radius:10px;padding:7px 12px;color:#fff;font-size:.8em;text-align:center;margin-bottom:10px;border:1px solid rgba(255,255,255,.25)}

@media(max-width:580px){
  .level-grid{grid-template-columns:repeat(3,1fr)}
  .g-body{flex-direction:column}
  .legend-panel{width:100%}
  .swatch-list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .swatch{width:100%;height:44px;border-radius:10px}
  .swatch-num{width:32px;min-width:32px;font-size:.95em}
  #start-screen h1{font-size:2em}
  .g-title{font-size:1.1em}
}
</style>
</head>
<body>

<!-- START -->
<div id="start-screen" class="screen active">
  <div class="emoji-row">🦋🐱🐟🐸🐰🐝🦉🐧🦁🐢🐻</div>
  <h1>動物填色遊戲</h1>
  <p>選左邊的顏色，再點圖案上相同數字的區塊！</p>
  <button class="btn btn-w" onclick="showLevelSelect()">▶ 開始遊戲</button>
</div>

<!-- LEVEL SELECT -->
<div id="level-select" class="screen">
  <h2>🗺 選擇關卡</h2>
  <div class="level-grid" id="levelGrid"></div>
  <div style="text-align:center"><button class="btn btn-w btn-sm" onclick="showScreen('start-screen')">← 返回</button></div>
</div>

<!-- GAME -->
<div id="game-screen" class="screen">
  <div class="g-header">
    <button class="btn btn-w btn-sm" onclick="showLevelSelect()">← 返回</button>
    <div class="g-title" id="gTitle">第 1 關</div>
    <div class="prog-wrap">
      <div class="prog-label">完成進度</div>
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="tip-bar" id="tipBar">👈 先選左邊的顏色數字，再點圖案上相同數字的區塊</div>
  <div class="g-body">
    <div class="legend-panel">
      <div class="lp-title">🎨 顏色表</div>
      <div class="swatch-list" id="swatchList"></div>
      <div class="g-actions">
        <button class="btn btn-w btn-sm" onclick="resetLevel()" style="margin-top:10px;width:100%">↺ 重置</button>
      </div>
    </div>
    <div class="svg-wrap" id="svgWrap"></div>
  </div>
</div>

<!-- COMPLETE -->
<div id="complete-screen" class="screen">
  <div class="c-stars">⭐⭐⭐</div>
  <h2 id="cTitle">完成了！</h2>
  <p id="cSub">太棒了！</p>
  <div class="c-svg-wrap" id="cSvg"></div>
  <button class="btn btn-w" onclick="showLevelSelect()">選關卡</button>
  <button class="btn btn-y" id="nextBtn" onclick="nextLevel()">下一關 →</button>
</div>

<div id="toast"></div>

// ── State ──
let cur=0, selNum=null;
let done=new Set(JSON.parse(localStorage.getItem('din2_done')||'[]'));

// ── Screens ──
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showLevelSelect(){renderGrid();showScreen('level-select')}

// ── Level grid ──
function renderGrid(){
  document.getElementById('levelGrid').innerHTML=LEVELS.map((lv,i)=>`
    <div class="lv-card ${done.has(i)?'done':''}" onclick="startLevel(${i})">
      <div class="lv-emoji">${lv.emoji}</div>
      <div class="lv-num">第 ${i+1} 關</div>
      <div class="lv-name">${lv.name}</div>
      ${done.has(i)?'<div class="lv-star">⭐</div>':''}
    </div>`).join('');
}

// ── Color swatches ──
function renderSwatches(){
  const lv=LEVELS[cur];
  document.getElementById('swatchList').innerHTML=lv.palette.map(p=>`
    <div class="swatch ${selNum===p.n?'sel':''}" onclick="pickNum(${p.n},this)" title="${p.label}">
      <div class="swatch-num">${p.n}</div>
      <div class="swatch-color" style="background:${p.c}"></div>
    </div>`).join('');
}
function pickNum(n,el){
  selNum=n;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
  // update tip
  const lv=LEVELS[cur];
  const p=lv.palette.find(x=>x.n===n);
  document.getElementById('tipBar').textContent=`已選 ${n} 號 (${p.label})，請點圖案中數字「${n}」的區塊`;
}

// ── Load level ──
function startLevel(i){
  cur=i; selNum=null;
  const lv=LEVELS[i];
  document.getElementById('gTitle').textContent=`第 ${i+1} 關 · ${lv.emoji} ${lv.name}`;
  document.getElementById('svgWrap').innerHTML=lv.svg;
  document.getElementById('progFill').style.width='0%';
  document.getElementById('tipBar').textContent='👈 先選左邊的顏色數字，再點圖案上相同數字的區塊';
  renderSwatches();

  // attach click to each region element individually
  document.querySelectorAll('#svgWrap .region').forEach(el=>{
    el.addEventListener('click', ()=>onRegionClick(el));
  });
  showScreen('game-screen');
}

function onRegionClick(el){
  const regionNum=parseInt(el.dataset.group);

  // already filled
  if(el.dataset.filled==='1'){
    toast('這個區塊已經著色了 ✓');
    return;
  }

  if(selNum===null){
    toast('請先點左邊的顏色數字！');
    return;
  }

  if(selNum===regionNum){
    // ✓ Correct
    const lv=LEVELS[cur];
    const p=lv.palette.find(x=>x.n===regionNum);
    el.setAttribute('fill', p.c);
    el.dataset.filled='1';
    el.classList.add('correct');
    setTimeout(()=>el.classList.remove('correct'),400);
    updateProg();
    checkWin();
  } else {
    // ✗ Wrong
    toast(`這裡是 ${regionNum} 號，請選 ${regionNum} 號的顏色！`);
    el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'),450);
  }
}

function updateProg(){
  const all=document.querySelectorAll('#svgWrap .region[data-group]');
  const filled=[...all].filter(e=>e.dataset.filled==='1').length;
  document.getElementById('progFill').style.width=(filled/all.length*100)+'%';
}

function checkWin(){
  const all=document.querySelectorAll('#svgWrap .region[data-group]');
  const filled=[...all].filter(e=>e.dataset.filled==='1').length;
  if(filled>=all.length) setTimeout(showComplete,700);
}

function resetLevel(){selNum=null;startLevel(cur)}

// ── Complete ──
function showComplete(){
  done.add(cur);
  localStorage.setItem('din2_done',JSON.stringify([...done]));
  const lv=LEVELS[cur];
  document.getElementById('cTitle').textContent=`完成了！${lv.emoji}`;
  document.getElementById('cSub').textContent=`第 ${cur+1} 關「${lv.name}」著色完成，真棒！`;
  document.getElementById('cSvg').innerHTML=document.getElementById('svgWrap').innerHTML;
  document.getElementById('nextBtn').style.display=cur<LEVELS.length-1?'':'none';
  showScreen('complete-screen');
}
function nextLevel(){startLevel(cur+1)}

// ── Toast ──
let toastTimer;
function toast(msg){
  clearTimeout(toastTimer);
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── Init ──
renderGrid();
</script>
